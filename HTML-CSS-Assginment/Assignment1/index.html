<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Assignment 1</title>

        <!-- 1. External CSS -->
        <!-- CSS styling is written in a separate file and imported here -->
        <link rel="stylesheet" href="styles.css" />

        <!-- 2. Internal CSS -->
        <!-- Written inside a <style> tag in the <head> tag, useful for small pages not ideal for large websites. -->
        <style>
            h2 {
                color: green;
                margin-bottom: 15px;
            }
        </style>
    </head>
    <body>
        <!-- 3. Inline CSS -->
        <!-- Written directly inside an HTML tag using the style attribute, but its not recommended for large projects because it's hard to maintain. -->
        <h1 style="color: red">All types of CSS uses</h1>

        <h2>Internal CSS Heading</h2>

        <p>
            This paragraph is styled using <strong>external CSS</strong>.
            external CSS is best for large projects.
        </p>

        <p>
            Inline CSS is quick but not recommended for big websites. Internal
            CSS is useful for small pages.
        </p>
    </body>
</html>
