<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Assignment 3 : Employee Table & Registration Form</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h2>Employee List</h2>
            <table class="employee-table">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Department</th>
                </tr>
                <tr>
                    <td>101</td>
                    <td>Alex Johnson</td>
                    <td>Developer</td>
                    <td>IT</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Maria Smith</td>
                    <td>Designer</td>
                    <td>Marketing</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Chris Lee</td>
                    <td>Manager</td>
                    <td>HR</td>
                </tr>
            </table>

            <h2>Registration Form</h2>
            <form class="registration-form">
                <div class="form-item">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        class="form-input"
                        placeholder="Enter your name"
                    />
                </div>

                <div class="form-item">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-input"
                        placeholder="Enter your email"
                    />
                </div>

                <div class="form-item">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-input"
                        placeholder="Enter password"
                    />
                </div>

                <button type="submit" class="form-button">Register</button>
            </form>
        </div>
    </body>
</html>
