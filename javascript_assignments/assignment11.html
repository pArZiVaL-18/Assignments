<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Countdown Timer</title>
    </head>
    <body>
        <center>
            <h2>Countdown</h2>
            <p id="timer">10</p>
        </center>
        <script>
            let timeLeft = 10;
            const timerElement = document.getElementById("timer");

            const countdown = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft === 0) {
                    clearInterval(countdown);
                    timerElement.textContent = "Time's up!";
                }
            }, 1000);
        </script>
    </body>
</html>
